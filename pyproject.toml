[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsagent-rl"
version = "0.1.0"
description = "RL-trained System Troubleshooting Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpsAgent-RL" }]
dependencies = [
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pandas>=2.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
train = [
    "verl>=0.3.0",
    "vllm>=0.6.0",
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "ray>=2.35.0",
    "datasets>=3.0.0",
    "wandb>=0.18.0",
]
dev = [
    "pytest>=8.0.0",
    "ipython>=8.0.0",
    "asciinema>=2.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
opsagent-generate = "data.generator:main"
opsagent-eval = "eval.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"env" = ["scenarios/**/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
