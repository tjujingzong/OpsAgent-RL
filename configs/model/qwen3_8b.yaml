# Qwen3-8B policy model config (active).
#
# Set the env var MODEL_PATH to your local Qwen3-8B weights dir, e.g.:
#   export MODEL_PATH=/path/to/Qwen3-8B
# All `hf_path`/`tokenizer`/`model_name` placeholders below are resolved from it
# at runtime; do NOT hardcode local paths here (keeps personal paths out of git).
#
# For standalone eval, rollout can be served by an external vLLM OpenAI server:
#   vllm serve $MODEL_PATH --host 0.0.0.0 --port 8000 \
#       --tensor-parallel-size 2 --dtype bfloat16 \
#       --max-model-len 8192 --gpu-memory-utilization 0.85 --trust-remote-code
# eval/benchmark's HTTPBackend hits that endpoint; verl training manages its own
# internal vLLM engine (colocated or separate), not this server.

model:
  name: "Qwen3-8B"
  hf_path: "${env:MODEL_PATH}"        # resolved from $MODEL_PATH at runtime
  hf_id: "Qwen/Qwen3-8B"              # public id (for re-download)
  tokenizer: "${env:MODEL_PATH}"
  use_flash_attention: true
  dtype: "bf16"

server:
  base_url: "http://127.0.0.1:8000/v1"
  model_name: "${env:MODEL_PATH}"     # must match the id reported by /v1/models
  api_key: "EMPTY"
  temperature: 0.7
  max_tokens: 4096

context:
  max_prompt_length: 2048
  max_new_tokens: 4096
  history_turns: 16        # keep last 16 conversation turns
  observation_head: 200   # chars kept from start of long output
  observation_tail: 300   # chars kept from end of long output
